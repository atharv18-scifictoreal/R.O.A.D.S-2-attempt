import speech_recognition as sr
import pyttsx3
import wikipedia
import pywhatkit
import datetime

# Voice Setup
engine = pyttsx3.init('sapi5')
voices = engine.getProperty('voices')
engine.setProperty('voice', voices[0]

def speak(audio):
    print(f"ROADS: {audio}")
    engine.say(audio)
    engine.runAndWait()

def greet_me():
    hour = int(datetime.datetime.now().hour)
    if hour >= 0 and hour < 12:
        speak("Good Morning Sir!")
    elif hour >= 12 and hour < 18:
        speak("Good Afternoon Sir!")
    else:
        speak("Good Evening Sir!")
    speak("R.O.A.D.S is active. I am listening to you continuously.")

def take_command():
    r = sr.Recognizer()
    with sr.Microphone() as source:
        print("\nListening...")
        r.pause_threshold = 0.6  # Fast response ke liye time kam kiya hai
        r.adjust_for_ambient_noise(source, duration=0.5) # Background noise control karne ke liye
        audio = r.listen(source)

    try:
        query = r.recognize_google(audio, language='en-in')
        print(f"User said: {query}\n")
    except Exception:
        # Agar kuch samajh na aaye ya aap chup ho, to error show nahi karega, bas loop chalta rahega
        return "none"
    return query.lower()

if __name__ == "__main__":
    greet_me()
    while True:
        query = take_command()

        # 1. Wikipedia Command
        if 'wikipedia' in query:
            speak('Searching Wikipedia...')
            query = query.replace("wikipedia", "")
            try:
                results = wikipedia.summary(query, sentences=2)
                speak("According to Wikipedia")
                speak(results)
            except Exception:
                speak("Sorry Sir, I couldn't find that on Wikipedia.")

        # 2. YouTube Command
        elif 'play' in query:
            song = query.replace('play', '')
            speak('Playing ' + song)
            pywhatkit.playonyt(song)

        # 3. Time Command
        elif 'time' in query:
            strTime = datetime.datetime.now().strftime("%I:%M %p")
            speak(f"Sir, the time is {strTime}")

        # 4. Stop Command (Ise band karne ke liye)
        elif 'exit' in query or 'stop' in query or 'bye' in query:
            speak("Going offline. Goodbye Sir!")
            break